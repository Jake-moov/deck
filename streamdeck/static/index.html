<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">

<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deck">

<title>Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="chassis">
    <header class="statusbar">
      <div class="brand">
        <span class="brand-mark" id="brandMark"></span>
        <span class="brand-text">DECK</span>
      </div>
      <div class="status" id="status">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">CONECTANDO</span>
      </div>
      <button class="gear-btn" id="fsBtn" aria-label="Tela cheia">⛶</button>
      <button class="gear-btn" id="gearBtn" aria-label="Editar deck">⚙</button>
    </header>

    <div class="now-playing" id="nowPlaying">
      <img class="np-art" id="npArt" alt="" src="/static/icon-192.png">
      <div class="np-info">
        <div class="np-title" id="npTitle">—</div>
        <div class="np-artist" id="npArtist">—</div>
        <div class="np-progress-track"><div class="np-progress-fill" id="npProgressFill"></div></div>
      </div>
      <div class="np-controls">
        <button class="np-btn" id="npPrev" aria-label="Anterior">⏮</button>
        <button class="np-btn np-btn-play" id="npPlayPause" aria-label="Play/Pause">⏸</button>
        <button class="np-btn" id="npNext" aria-label="Próxima">⏭</button>
      </div>
    </div>

    <div class="screens-viewport">
      <div class="screens" id="screens">
        <section class="screen screen-apps">
          <div class="apps-layout">
            <main class="grid" id="grid"></main>
            <aside class="quick-volume">
              <button class="mute-btn" id="muteBtn" aria-label="Mudo">🔊</button>
              <input type="range" min="0" max="100" value="50" id="volumeSlider" class="volume-slider vertical" aria-label="Volume geral" orient="vertical">
              <span class="volume-readout" id="volumeReadout">--%</span>
            </aside>
          </div>
        </section>

        <section class="screen screen-audio">
          <div class="audio-mixer" id="audioMixer">
            <div class="fader-col" id="masterFaderCol">
              <span class="icon">🔊</span>
              <input type="range" min="0" max="100" value="50" id="volumeSlider2" class="volume-slider vertical" aria-label="Volume geral" orient="vertical">
              <span class="volume-readout" id="volumeReadout2">--%</span>
              <button class="mute-btn" id="muteBtn2" aria-label="Mudo">🔇</button>
              <span class="fader-label">Geral</span>
            </div>
          </div>
        </section>
      </div>
    </div>

    <nav class="screen-tabs" id="screenTabs">
      <button class="tab-btn active" data-screen="apps" aria-label="Apps">⌨</button>
      <button class="tab-btn" data-screen="audio" aria-label="Áudio">🎚</button>
    </nav>
  </div>

  <div class="editor-overlay" id="editorOverlay">
    <div class="editor-sheet" id="editorSheet"></div>
  </div>

  <div class="install-tip" id="installTip"></div>

<script src="/static/script.js"></script>
</body>
</html>
