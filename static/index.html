<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">

<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deck">

<title>Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="chassis">
    <header class="statusbar">
      <div class="brand">
        <span class="brand-mark" id="brandMark"></span>
        <span class="brand-text">DECK</span>
      </div>
      <div class="status" id="status">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">CONECTANDO</span>
      </div>
      <button class="gear-btn" id="fsBtn" aria-label="Tela cheia">⛶</button>
    </header>

    <nav class="top-tabs" aria-label="Telas">
      <div class="tabs-pill" id="screenTabs">
        <span class="tabs-indicator" aria-hidden="true"></span>
        <button class="tab-btn active" data-screen="apps" aria-label="Teclas">
          <span class="tab-ico">⌨</span><span class="tab-lbl">Teclas</span>
        </button>
        <button class="tab-btn" data-screen="audio" aria-label="Áudio">
          <span class="tab-ico">🎚</span><span class="tab-lbl">Áudio</span>
        </button>
      </div>
    </nav>

    <div class="screens-viewport" id="screensViewport">
      <div class="screens" id="screens">
        <section class="screen screen-apps">
          <div class="apps-layout">
            <main class="grid" id="grid"></main>
            <aside class="quick-volume">
              <button class="mute-btn" id="muteBtn" aria-label="Mudo">🔊</button>
              <div class="fader-slot" id="quickFader"></div>
              <span class="volume-readout" id="volumeReadout">--%</span>
            </aside>
          </div>
        </section>

        <section class="screen screen-audio">
          <div class="audio-layout">
            <div class="now-playing compact idle" id="nowPlaying">
              <img class="np-art" id="npArt" alt="" src="/static/icon-192.png">
              <div class="np-info">
                <div class="np-source" id="npSource"></div>
                <div class="np-title" id="npTitle">Nada tocando</div>
                <div class="np-artist" id="npArtist"></div>
              </div>
              <div class="np-controls">
                <button class="np-btn" id="npPrev" aria-label="Anterior">⏮</button>
                <button class="np-btn np-btn-play" id="npPlayPause" aria-label="Play/Pause">▶</button>
                <button class="np-btn" id="npNext" aria-label="Próxima">⏭</button>
              </div>
              <div class="np-progress-track"><div class="np-progress-fill" id="npProgressFill"></div></div>
            </div>

            <div class="audio-mixer" id="audioMixer"></div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div class="install-tip" id="installTip"></div>

<script src="/static/icons.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
